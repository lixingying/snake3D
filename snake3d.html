let torusMesh = null;
let torusMaterial = null;
let markMeshFront = null;
let markMeshBack = null;
let markMaterialFront = null;
let markMaterialBack = null;
let cutOverlayGroup = null;

function ensureSurfaceGeometry() {
  if (!torusMaterial) {
    torusMaterial = new THREE.MeshStandardMaterial({
      map: surfaceTex,
      roughness: 0.74,
      metalness: 0,
      side: ['sphere', 'genus2', 'projective', 'mobius', 'klein'].includes(MAP_TYPE) ? THREE.DoubleSide : THREE.FrontSide,
    });
  }
  if (!markMaterialFront) {
    if (MAP_TYPE === 'sphere') {
      markMaterialFront = CUBE_FACE_KEYS.map(faceKey => createMarkMaterial(sphereMarkTexFront[faceKey], THREE.DoubleSide));
      markMaterialBack = CUBE_FACE_KEYS.map(faceKey => createMarkMaterial(sphereMarkTexBack[faceKey], THREE.DoubleSide));
    } else if (MAP_TYPE === 'genus2') {
      markMaterialFront = getGenus2Topology().faces.map(face => createMarkMaterial(genus2MarkTex[face.key], THREE.DoubleSide));
      markMaterialBack = null;
    } else if (MAP_TYPE === 'projective') {
      markMaterialFront = createMarkMaterial(markTexFront, THREE.DoubleSide);
      markMaterialBack = null;
    } else {
      markMaterialFront = createMarkMaterial(markTexFront, THREE.FrontSide);
      markMaterialBack = createMarkMaterial(markTexBack, THREE.BackSide);
    }
  }
  if (torusMesh) {
    torusMesh.geometry.dispose();
    surfaceGroup.remove(torusMesh);
  }
  if (markMeshFront) surfaceGroup.remove(markMeshFront);
  if (markMeshBack) surfaceGroup.remove(markMeshBack);
  if (cutOverlayGroup) {
    disposeObject3D(cutOverlayGroup);
    surfaceGroup.remove(cutOverlayGroup);
    cutOverlayGroup = null;
  }
  const R = getR(), r = getr();
  let geo;
  if (MAP_TYPE === 'sphere') {
    geo = createCubeSphereGeometry();
  } else if (MAP_TYPE === 'genus2') {
    geo = createGenus2Geometry();
  } else if (MAP_TYPE === 'projective') {
    geo = createProjectiveGeometry();
  } else if (MAP_TYPE === 'mobius') {
    geo = createMobiusGeometry();
  } else if (MAP_TYPE === 'klein') {
    geo = createKleinGeometry();
  } else {
    geo = new THREE.TorusGeometry(R, r, 48, 128);
  }
  torusMesh = new THREE.Mesh(geo, torusMaterial);
  torusMesh.position.set(0, 0, 0);
  torusMesh.castShadow = true;
  torusMesh.receiveShadow = true;
  surfaceGroup.add(torusMesh);

  if (MAP_TYPE === 'genus2' || MAP_TYPE === 'projective') {
    markMeshFront = new THREE.Mesh(geo, markMaterialFront);
    markMeshFront.renderOrder = 2;
    surfaceGroup.add(markMeshFront);
  } else {
    markMeshFront = new THREE.Mesh(geo, markMaterialFront);
    markMeshBack = new THREE.Mesh(geo, markMaterialBack);
    markMeshFront.renderOrder = 2;
    markMeshBack.renderOrder = 2;
    surfaceGroup.add(markMeshFront);
    surfaceGroup.add(markMeshBack);
  }

  cutOverlayGroup = createCutOverlayGroup();
  if (cutOverlayGroup) {
    cutOverlayGroup.visible = topologyHintsVisible;
    surfaceGroup.add(cutOverlayGroup);
  }
}

function getR() { return BASE_R * fieldScale; }
function getr() { return BASE_R_TUBE * fieldScale; }

const CUBE_FACE_KEYS = ['F', 'R', 'B', 'L', 'U', 'D'];
const CUBE_FACES = {
  F: { n: new THREE.Vector3(0, 0, 1),  r: new THREE.Vector3(1, 0, 0),  d: new THREE.Vector3(0, -1, 0) },
  R: { n: new THREE.Vector3(1, 0, 0),  r: new THREE.Vector3(0, 0, -1), d: new THREE.Vector3(0, -1, 0) },
  B: { n: new THREE.Vector3(0, 0, -1), r: new THREE.Vector3(-1, 0, 0), d: new THREE.Vector3(0, -1, 0) },
  L: { n: new THREE.Vector3(-1, 0, 0), r: new THREE.Vector3(0, 0, 1),  d: new THREE.Vector3(0, -1, 0) },
  U: { n: new THREE.Vector3(0, 1, 0),  r: new THREE.Vector3(1, 0, 0),  d: new THREE.Vector3(0, 0, 1) },
  D: { n: new THREE.Vector3(0, -1, 0), r: new THREE.Vector3(1, 0, 0),  d: new THREE.Vector3(0, 0, -1) },
};
const CUBE_TRANSITIONS = {
  F: {
    L: (x, y) => ({ face: 'L', gx: CUT_GRID_SIZE - 1, gy: y, dir: { dx: -1, dy: 0 } }),
    R: (x, y) => ({ face: 'R', gx: 0, gy: y, dir: { dx: 1, dy: 0 } }),
    U: (x, y) => ({ face: 'U', gx: x, gy: CUT_GRID_SIZE - 1, dir: { dx: 0, dy: -1 } }),

  R: {

    U: (x, y) => ({ face: 'U', gx: CUT_GRID_SIZE - 1, gy: CUT_GRID_SIZE - 1 - x, dir: { dx: -1, dy: 0 } }),

  },
  L: {
    L: (x, y) => ({ face: 'B', gx: CUT_GRID_SIZE - 1, gy: y, dir: { dx: -1, dy: 0 } }),
    R: (x, y) => ({ face: 'F', gx: 0, gy: y, dir: { dx: 1, dy: 0 } }),
    U: (x, y) => ({ face: 'U', gx: 0, gy: x, dir: { dx: 1, dy: 0 } }),
    D: (x, y) => ({ face: 'D', gx: 0, gy: CUT_GRID_SIZE - 1 - x, dir: { dx: 1, dy: 0 } }),
  },
  U: {
    L: (x, y) => ({ face: 'L', gx: y, gy: 0, dir: { dx: 0, dy: 1 } }),
    R: (x, y) => ({ face: 'R', gx: CUT_GRID_SIZE - 1 - y, gy: 0, dir: { dx: 0, dy: 1 } }),
    U: (x, y) => ({ face: 'B', gx: CUT_GRID_SIZE - 1 - x, gy: 0, dir: { dx: 0, dy: 1 } }),
    D: (x, y) => ({ face: 'F', gx: x, gy: 0, dir: { dx: 0, dy: 1 } }),
  },
  D: {
    L: (x, y) => ({ face: 'L', gx: CUT_GRID_SIZE - 1 - y, gy: CUT_GRID_SIZE - 1, dir: { dx: 0, dy: -1 } }),
    R: (x, y) => ({ face: 'R', gx: y, gy: CUT_GRID_SIZE - 1, dir: { dx: 0, dy: -1 } }),
    U: (x, y) => ({ face: 'F', gx: x, gy: CUT_GRID_SIZE - 1, dir: { dx: 0, dy: -1 } }),
    D: (x, y) => ({ face: 'B', gx: CUT_GRID_SIZE - 1 - x, gy: CUT_GRID_SIZE - 1, dir: { dx: 0, dy: -1 } }),
  },
};

function cubeVector(faceKey, u01, v01) {
  const face = CUBE_FACES[faceKey || 'F'];
  return face.n.clone()
    .add(face.r.clone().multiplyScalar(u01 * 2 - 1))
    .add(face.d.clone().multiplyScalar(v01 * 2 - 1));
}


function cubeSpherePoint(faceKey, u01, v01) {
  return cubeVector(faceKey, u01, v01).normalize().multiplyScalar(getR());
}


function createCubeSphereGeometry() {
  const segments = 32;
  const positions = [];
  const uvs = [];
  const indices = [];
  const groups = [];
  const row = segments + 1;

  for (const [faceIndex, faceKey] of CUBE_FACE_KEYS.entries()) {
    const offset = positions.length / 3;
    const face = CUBE_FACES[faceKey];
    const groupStart = indices.length;
    for (let y = 0; y <= segments; y++) {
      const v = y / segments;
      for (let x = 0; x <= segments; x++) {
        const u = x / segments;
        const p = cubeSpherePoint(faceKey, u, v);
        positions.push(p.x, p.y, p.z);
        uvs.push(u, v);
      }
    }
    for (let y = 0; y < segments; y++) {
      for (let x = 0; x < segments; x++) {
        const a = offset + y * row + x;
        const b = offset + y * row + x + 1;
        const c = offset + (y + 1) * row + x;
        const d = offset + (y + 1) * row + x + 1;
        const winding = face.r.clone().cross(face.d).dot(face.n);
        if (winding > 0) indices.push(a, b, c, b, d, c);
        else indices.push(a, c, b, b, c, d);
      }
    }
    groups.push({ start: groupStart, count: indices.length - groupStart, materialIndex: faceIndex });
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  for (const group of groups) geo.addGroup(group.start, group.count, group.materialIndex);
  geo.computeVertexNormals();
  geo.computeBoundingSphere();
  return geo;
}

const GENUS2_SMOOTH = 0.18;
const GENUS2_PATCH_CELLS = 6;
const GENUS2_PATCH_RENDER_SEGMENTS = GENUS2_PATCH_CELLS * 2;
const GENUS2_POLYCUBE_SCALE = { x: 0.58, y: 0.55, z: 0.54 };
const GENUS2_BASE_FACE = 'G2_0_0_0_PZ';

function smoothMin(a, b, k) {
  const h = Math.max(0, Math.min(1, 0.5 + 0.5 * (b - a) / k));
  return b * (1 - h) + a * h - k * h * (1 - h);
}

function genus2TorusDistance(p, cx) {
  const R = GENUS2_RING_R * fieldScale;
  const r = GENUS2_TUBE_R * fieldScale;
  const radial = Math.hypot(p.x - cx, p.y) - R;
  return Math.hypot(radial, p.z) - r;
}

function genus2Field(x, y, z) {
  const offset = GENUS2_CENTER_OFFSET * fieldScale;
  const p = { x, y, z };
  const left = genus2TorusDistance(p, -offset);
  const right = genus2TorusDistance(p, offset);
  return smoothMin(left, right, GENUS2_SMOOTH * fieldScale);
}

function genus2FieldGradient(x, y, z) {
  const offset = GENUS2_CENTER_OFFSET * fieldScale;
  function torus(cx) {
    const px = x - cx, radial = Math.max(1e-12, Math.hypot(px, y));
    const q = radial - GENUS2_RING_R * fieldScale, length = Math.max(1e-12, Math.hypot(q, z));
    return { distance: length - GENUS2_TUBE_R * fieldScale,
      gradient: new THREE.Vector3(q * px / (length * radial), q * y / (length * radial), z / length) };
  }
  const a = torus(-offset), b = torus(offset);
  const h = Math.max(0, Math.min(1, 0.5 + 0.5 * (b.distance - a.distance) / (GENUS2_SMOOTH * fieldScale)));
  return a.gradient.multiplyScalar(h).addScaledVector(b.gradient, 1 - h);
}

function estimateGenus2Normal(x, y, z) {
  return genus2FieldGradient(x, y, z).normalize();
}

const GENUS2_FACE_DIRECTIONS = [
  { key: 'PX', n: [ 1,  0,  0], r: [ 0,  1,  0], d: [ 0,  0, -1] },
  { key: 'NX', n: [-1,  0,  0], r: [ 0, -1,  0], d: [ 0,  0, -1] },
  { key: 'PY', n: [ 0,  1,  0], r: [-1,  0,  0], d: [ 0,  0, -1] },
  { key: 'NY', n: [ 0, -1,  0], r: [ 1,  0,  0], d: [ 0,  0, -1] },
  { key: 'PZ', n: [ 0,  0,  1], r: [ 1,  0,  0], d: [ 0, -1,  0] },
  { key: 'NZ', n: [ 0,  0, -1], r: [ 1,  0,  0], d: [ 0,  1,  0] },
];
const GENUS2_EDGE_KEYS = ['L', 'R', 'U', 'D'];
let genus2TopologyCache = null;

function vec3Key(x, y, z) {
  return `${x},${y},${z}`;
}

function vAdd(a, b) {
  return [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
}

function vSub(a, b) {
  return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
}

function vScale(a, s) {
  return [a[0] * s, a[1] * s, a[2] * s];
}

function vDot(a, b) {
  return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
}

function genus2VoxelPoint(face, u, v) {
  return vAdd(
    vAdd(face.c, vScale(face.n, 0.5)),
    vAdd(vScale(face.r, u - 0.5), vScale(face.d, v - 0.5)),
  );
}

function genus2EdgePoint(face, edge, t) {
  if (edge === 'L') return genus2VoxelPoint(face, 0, t);
  if (edge === 'R') return genus2VoxelPoint(face, 1, t);
  if (edge === 'U') return genus2VoxelPoint(face, t, 0);
  return genus2VoxelPoint(face, t, 1);
}

function genus2EdgeKey(a, b) {
  const pa = a.map(v => Math.round(v * 2)).join(',');
  const pb = b.map(v => Math.round(v * 2)).join(',');
  return pa < pb ? `${pa}|${pb}` : `${pb}|${pa}`;
}

function buildGenus2Topology() {
  const voxels = [];
  for (let y = -1; y <= 1; y++) {
    for (let x = -2; x <= 2; x++) {
      if ((x === -1 || x === 1) && y === 0) continue;
      voxels.push({ x, y, z: 0 });
    }
  }

  const solid = new Set(voxels.map(v => vec3Key(v.x, v.y, v.z)));
  const faces = [];
  const faceMap = new Map();

  for (const voxel of voxels) {
    for (const dir of GENUS2_FACE_DIRECTIONS) {
      const nx = voxel.x + dir.n[0];
      const ny = voxel.y + dir.n[1];
      const nz = voxel.z + dir.n[2];
      if (solid.has(vec3Key(nx, ny, nz))) continue;
      const face = {
        key: `G2_${voxel.x}_${voxel.y}_${voxel.z}_${dir.key}`,
        c: [voxel.x, voxel.y, voxel.z],
        n: dir.n,
        r: dir.r,
        d: dir.d,
        transitions: {},
      };
      faces.push(face);
      faceMap.set(face.key, face);
    }
  }

  const edgeMap = new Map();
  for (const face of faces) {
    for (const edge of GENUS2_EDGE_KEYS) {
      const key = genus2EdgeKey(genus2EdgePoint(face, edge, 0), genus2EdgePoint(face, edge, 1));
      if (!edgeMap.has(key)) edgeMap.set(key, []);
      edgeMap.get(key).push({ face, edge });
    }
  }

  for (const records of edgeMap.values()) {
    if (records.length !== 2) continue;
    const [a, b] = records;
    a.face.transitions[a.edge] = { face: b.face.key, edge: b.edge };
    b.face.transitions[b.edge] = { face: a.face.key, edge: a.edge };
  }

  const startFace = faces.find(face =>
    face.c[0] === -2 && face.c[1] === -1 && face.n[2] === 1
  ) || faces[0];
  return { faces, faceMap, startFaceKey: startFace.key };
}

function getGenus2Topology() {
  if (!genus2TopologyCache) genus2TopologyCache = buildGenus2Topology();
  return genus2TopologyCache;
}

function genus2StartFaceKey() {
  return getGenus2Topology().startFaceKey;
}

function randomGenus2FaceKey() {
  const faces = getGenus2Topology().faces;
  return faces[Math.floor(Math.random() * faces.length)].key;
}

function genus2LocalUVFromVoxel(face, p) {
  const center = vAdd(face.c, vScale(face.n, 0.5));
  const delta = vSub(p, center);
  return {
    u: vDot(delta, face.r) + 0.5,
    v: vDot(delta, face.d) + 0.5,
  };
}

function genus2RawPoint(faceKey, u, v) {
  const topology = getGenus2Topology();
  const face = topology.faceMap.get(faceKey) || topology.faceMap.get(topology.startFaceKey);
  const p = genus2VoxelPoint(face, u, v);
  return new THREE.Vector3(
    p[0] * GENUS2_POLYCUBE_SCALE.x * fieldScale,
    p[1] * GENUS2_POLYCUBE_SCALE.y * fieldScale,
    p[2] * GENUS2_POLYCUBE_SCALE.z * fieldScale,
  );
}

function projectToGenus2Surface(point) {
  const p = point.clone();
  for (let i = 0; i < 16; i++) {
    const value = genus2Field(p.x, p.y, p.z);
    // The position tolerance must be finer than the navigation derivative.
    // The former coarse tolerance introduced jumps in the tangent frame.
    if (Math.abs(value) < 1e-10 * fieldScale) break;
    const gradient = genus2FieldGradient(p.x, p.y, p.z);
    p.addScaledVector(gradient, -value / Math.max(1e-12, gradient.lengthSq()));
  }
  return p;
}

function genus2SurfacePoint(faceKey, u, v, lift = 0) {
  const p = projectToGenus2Surface(genus2RawPoint(faceKey, u, v));
  if (lift !== 0) p.addScaledVector(estimateGenus2Normal(p.x, p.y, p.z), lift * fieldScale);
  return p;
}

function genus2Point(gx, gy, faceKey = null) {
  const face = faceKey || genus2StartFaceKey();
  return genus2SurfacePoint(
    face,
    (gx + 0.5) / GENUS2_PATCH_CELLS,
    (gy + 0.5) / GENUS2_PATCH_CELLS,
  );
}

function genus2GridVertexKey(faceKey, ix, iy) {
  const topology = getGenus2Topology();
  const face = topology.faceMap.get(faceKey) || topology.faceMap.get(topology.startFaceKey);
  const p = genus2VoxelPoint(face, ix / GENUS2_PATCH_CELLS, iy / GENUS2_PATCH_CELLS);
  return p.map(v => Math.round(v * 2 * GENUS2_PATCH_CELLS)).join(',');
}

function genus2GridVertexPoint(faceKey, ix, iy, lift = 0) {
  return genus2SurfacePoint(
    faceKey,
    ix / GENUS2_PATCH_CELLS,
    iy / GENUS2_PATCH_CELLS,
    lift,
  );
}

function gridEdgeKey(a, b) {
  return a < b ? `${a}|${b}` : `${b}|${a}`;
}

function genus2GridEdgeKey(faceKey, gx, gy, edge) {
  let a, b;
  if (edge === 'L') {
    a = genus2GridVertexKey(faceKey, gx, gy);
    b = genus2GridVertexKey(faceKey, gx, gy + 1);
  } else if (edge === 'R') {
    a = genus2GridVertexKey(faceKey, gx + 1, gy);
    b = genus2GridVertexKey(faceKey, gx + 1, gy + 1);
  } else if (edge === 'U') {
    a = genus2GridVertexKey(faceKey, gx, gy);
    b = genus2GridVertexKey(faceKey, gx + 1, gy);
  } else {
    a = genus2GridVertexKey(faceKey, gx, gy + 1);
    b = genus2GridVertexKey(faceKey, gx + 1, gy + 1);
  }
  return gridEdgeKey(a, b);
}

function addGenus2GraphVertex(vertices, key, point) {
  if (!vertices.has(key)) {
    vertices.set(key, { key, point, edges: [] });
  }
}

function addGenus2GraphEdge(vertices, edges, a, b) {
  const key = gridEdgeKey(a, b);
  if (!edges.has(key)) {
    edges.set(key, { key, a, b });
    vertices.get(a).edges.push(key);
    vertices.get(b).edges.push(key);
  }
}

function buildGenus2GridGraph() {
  const vertices = new Map();
  const edges = new Map();
  const topology = getGenus2Topology();
  for (const face of topology.faces) {
    for (let gy = 0; gy < GENUS2_PATCH_CELLS; gy++) {
      for (let gx = 0; gx < GENUS2_PATCH_CELLS; gx++) {
        const v00 = genus2GridVertexKey(face.key, gx, gy);
        const v10 = genus2GridVertexKey(face.key, gx + 1, gy);
        const v01 = genus2GridVertexKey(face.key, gx, gy + 1);
        const v11 = genus2GridVertexKey(face.key, gx + 1, gy + 1);
        addGenus2GraphVertex(vertices, v00, genus2GridVertexPoint(face.key, gx, gy, 0.04));
        addGenus2GraphVertex(vertices, v10, genus2GridVertexPoint(face.key, gx + 1, gy, 0.04));
        addGenus2GraphVertex(vertices, v01, genus2GridVertexPoint(face.key, gx, gy + 1, 0.04));
        addGenus2GraphVertex(vertices, v11, genus2GridVertexPoint(face.key, gx + 1, gy + 1, 0.04));
        addGenus2GraphEdge(vertices, edges, v00, v01);
        addGenus2GraphEdge(vertices, edges, v10, v11);
        addGenus2GraphEdge(vertices, edges, v00, v10);
        addGenus2GraphEdge(vertices, edges, v01, v11);
      }
    }
  }

  const root = [...vertices.keys()].sort()[0];
  const parent = new Map([[root, null]]);
  const queue = [root];
  while (queue.length > 0) {
    const current = queue.shift();
    const adjacent = vertices.get(current).edges.slice().sort();
    for (const edgeKey of adjacent) {
      const edge = edges.get(edgeKey);
      const next = edge.a === current ? edge.b : edge.a;
      if (parent.has(next)) continue;
      parent.set(next, { vertex: current, edge: edgeKey });
      queue.push(next);
    }
  }

  return { vertices, edges, parent, root };
}

function genus2RootPath(parent, root, vertex) {
  const path = [];
  let current = vertex;
  while (current !== null && current !== undefined) {
    path.push(current);
    if (current === root) break;
    current = parent.get(current)?.vertex;
  }
  return path.reverse();
}

let genus2CutSchemaCache = null;
function genus2CutWaypoint(face, ix, iy) {
  return { face, ix, iy };
}

function genus2CutPathDefs() {
  const n = GENUS2_PATCH_CELLS;
  const h = Math.floor(n / 2);
  const base = GENUS2_BASE_FACE;
  return [
    {
      label: 'a',
      // This orientation matches the a,c,A order on the shared stem.
      vertices: [
        genus2CutWaypoint(base, h, h),
        genus2CutWaypoint(base, 0, h),
        genus2CutWaypoint(base, 0, n),
        genus2CutWaypoint('G2_-1_-1_0_PZ', n, 0),
        genus2CutWaypoint('G2_-1_-1_0_PZ', 0, 0),
        genus2CutWaypoint('G2_-2_0_0_PZ', n, n),
        genus2CutWaypoint('G2_-2_0_0_PZ', n, 0),
        genus2CutWaypoint('G2_-1_1_0_PZ', 0, n),
        genus2CutWaypoint('G2_-1_1_0_PZ', n, n),
        genus2CutWaypoint(base, 0, 0),
        genus2CutWaypoint(base, 0, h),
        genus2CutWaypoint(base, h, h),
      ],
    },
    {
      label: 'b',
      vertices: [
        genus2CutWaypoint(base, h, h),
        genus2CutWaypoint(base, n, h),
        genus2CutWaypoint(base, n, 0),
        genus2CutWaypoint('G2_1_1_0_PZ', 0, n),
        genus2CutWaypoint('G2_1_1_0_PZ', n, n),
        genus2CutWaypoint('G2_2_0_0_PZ', 0, 0),
        genus2CutWaypoint('G2_2_0_0_PZ', 0, n),
        genus2CutWaypoint('G2_1_-1_0_PZ', n, 0),
        genus2CutWaypoint('G2_1_-1_0_PZ', 0, 0),
        genus2CutWaypoint(base, n, n),
        genus2CutWaypoint(base, n, h),
        genus2CutWaypoint(base, h, h),
      ],
    },
    {
      label: 'c',
      vertices: [
        genus2CutWaypoint(base, h, h),
        genus2CutWaypoint(base, 0, h),
        genus2CutWaypoint('G2_0_0_0_NX', h, 0),
        genus2CutWaypoint('G2_0_0_0_NX', h, n),
        genus2CutWaypoint('G2_0_0_0_NZ', 0, h),
        genus2CutWaypoint('G2_0_0_0_NZ', 0, 0),
        genus2CutWaypoint('G2_-1_-1_0_NZ', n, n),
        genus2CutWaypoint('G2_-1_-1_0_NZ', 0, n),
        genus2CutWaypoint('G2_-2_0_0_NZ', n, 0),
        genus2CutWaypoint('G2_-2_0_0_NZ', n, h),
        genus2CutWaypoint('G2_-2_0_0_NZ', 0, h),
        genus2CutWaypoint('G2_-2_0_0_NX', h, n),
        genus2CutWaypoint('G2_-2_0_0_NX', h, 0),
        genus2CutWaypoint('G2_-2_0_0_PZ', 0, h),
        genus2CutWaypoint('G2_-2_0_0_PZ', 0, 0),
        genus2CutWaypoint('G2_-2_1_0_PZ', 0, n),
        genus2CutWaypoint('G2_-2_1_0_PZ', 0, 0),
        genus2CutWaypoint('G2_-2_1_0_PZ', n, 0),
        genus2CutWaypoint('G2_-1_1_0_PZ', 0, 0),
        genus2CutWaypoint('G2_-1_1_0_PZ', n, 0),
        genus2CutWaypoint('G2_0_1_0_PZ', 0, 0),
        genus2CutWaypoint('G2_0_1_0_PZ', h, 0),
        genus2CutWaypoint('G2_0_1_0_PZ', h, n),
        genus2CutWaypoint(base, h, 0),
        genus2CutWaypoint(base, h, h),
      ],
    },
    {
      label: 'd',
      vertices: [
        genus2CutWaypoint(base, h, h),
        genus2CutWaypoint(base, n, h),
        genus2CutWaypoint('G2_0_0_0_PX', h, 0),
        genus2CutWaypoint('G2_0_0_0_PX', h, n),
        genus2CutWaypoint('G2_0_0_0_NZ', n, h),
        genus2CutWaypoint('G2_0_0_0_NZ', n, 0),
        genus2CutWaypoint('G2_1_-1_0_NZ', 0, n),
        genus2CutWaypoint('G2_1_-1_0_NZ', n, n),
        genus2CutWaypoint('G2_2_0_0_NZ', 0, 0),
        genus2CutWaypoint('G2_2_0_0_NZ', 0, h),
        genus2CutWaypoint('G2_2_0_0_NZ', n, h),
        genus2CutWaypoint('G2_2_0_0_PX', h, n),
        genus2CutWaypoint('G2_2_0_0_PX', h, 0),
        genus2CutWaypoint('G2_2_0_0_PZ', n, h),
        genus2CutWaypoint('G2_2_0_0_PZ', n, n),
        genus2CutWaypoint('G2_2_-1_0_PZ', n, 0),
        genus2CutWaypoint('G2_2_-1_0_PZ', n, n),
        genus2CutWaypoint('G2_2_-1_0_PZ', 0, n),
        genus2CutWaypoint('G2_1_-1_0_PZ', n, n),
        genus2CutWaypoint('G2_1_-1_0_PZ', 0, n),
        genus2CutWaypoint('G2_0_-1_0_PZ', n, n),
        genus2CutWaypoint('G2_0_-1_0_PZ', h, n),
        genus2CutWaypoint('G2_0_-1_0_PZ', h, 0),

function genus2WaypointWithKey(vertex) {
  return {
    ...vertex,
    key: genus2GridVertexKey(vertex.face, vertex.ix, vertex.iy),
  };
}

function pushGenus2CutPoint(points, point) {
  const last = points[points.length - 1];
  if (!last || last.key !== point.key || (point.face && last.face !== point.face)) {
    points.push(point);
  }
}

function appendGenus2CutLine(points, face, from, to) {
  let ix = from.ix;
  let iy = from.iy;
  const sx = Math.sign(to.ix - from.ix);
  const sy = Math.sign(to.iy - from.iy);
  while (ix !== to.ix) {
    ix += sx;
    pushGenus2CutPoint(points, genus2WaypointWithKey({ face, ix, iy }));
  }
  while (iy !== to.iy) {
    iy += sy;
    pushGenus2CutPoint(points, genus2WaypointWithKey({ face, ix, iy }));
  }
}

function genus2ShortestVertexPath(graph, startKey, endKey) {
  const parent = new Map([[startKey, null]]);
  const queue = [startKey];
  while (queue.length > 0 && !parent.has(endKey)) {
    const current = queue.shift();
    for (const edgeKey of graph.vertices.get(current)?.edges || []) {
      const edge = graph.edges.get(edgeKey);
      const next = edge.a === current ? edge.b : edge.a;
      if (parent.has(next)) continue;
      parent.set(next, current);
      queue.push(next);
    }
  }
  if (!parent.has(endKey)) return [startKey, endKey];

  const path = [];
  let current = endKey;
  while (current !== null) {
    path.push(current);
    current = parent.get(current);
  }
  return path.reverse();
}

function appendGenus2CutSegment(points, graph, fromVertex, toVertex) {
  const from = genus2WaypointWithKey(fromVertex);
  const to = genus2WaypointWithKey(toVertex);
  pushGenus2CutPoint(points, from);
  if (from.key === to.key) return;

  if (from.face === to.face) {
    appendGenus2CutLine(points, from.face, from, to);
    return;
  }

  const path = genus2ShortestVertexPath(graph, from.key, to.key);
  for (let i = 1; i < path.length; i++) {
    pushGenus2CutPoint(points, { face: null, ix: null, iy: null, key: path[i] });
  }
}

function buildGenus2CutPoints(def, graph) {
  const points = [];
  for (let i = 0; i < def.vertices.length - 1; i++) {
    appendGenus2CutSegment(points, graph, def.vertices[i], def.vertices[i + 1]);
  }
  return points;
}

function buildGenus2CutEdges(def, points) {
  const cuts = [];
  for (let i = 1; i < points.length; i++) {
    const a = points[i - 1];
    const b = points[i];
    if (a.key === b.key) continue;
    cuts.push({
      label: def.label,
      color: CUT_COLORS[def.label],
      edgeKey: gridEdgeKey(a.key, b.key),
      face: a.face === b.face ? a.face : null,
      tx: a.face === b.face ? b.ix - a.ix : 0,
      ty: a.face === b.face ? b.iy - a.iy : 0,
    });
  }
  return cuts;
}

function getGenus2CutSchema() {
  if (!genus2CutSchemaCache) {
    const graph = buildGenus2GridGraph();
    const cuts = [];
    const loops = genus2CutPathDefs().map(def => {
      const points = buildGenus2CutPoints(def, graph);
      cuts.push(...buildGenus2CutEdges(def, points));
      return {
        label: def.label,
        color: CUT_COLORS[def.label],
        points: points
          .filter((point, i) => i === 0 || point.key !== points[i - 1].key)
          .map(point => graph.vertices.get(point.key).point),
      };
    });
    const byEdgeKey = new Map();
    for (const cut of cuts) {
      if (!byEdgeKey.has(cut.edgeKey)) byEdgeKey.set(cut.edgeKey, []);
      byEdgeKey.get(cut.edgeKey).push(cut);
    }
    genus2CutSchemaCache = {
      cuts,
      graph,
      loops,
      byEdgeKey,
    };
  }
  return genus2CutSchemaCache;
}

function createGenus2Geometry() {
  const positions = [];
  const uvs = [];
  const topology = getGenus2Topology();
  const segments = GENUS2_PATCH_RENDER_SEGMENTS;

  function addVertex(p, u, v) {
    positions.push(p.x, p.y, p.z);
    uvs.push(u, v);
  }

  function addTriangle(a, b, c, auv, buv, cuv) {
    const center = new THREE.Vector3().add(a).add(b).add(c).multiplyScalar(1 / 3);
    const outward = estimateGenus2Normal(center.x, center.y, center.z);
    const winding = new THREE.Vector3().subVectors(b, a).cross(new THREE.Vector3().subVectors(c, a));
    if (winding.dot(outward) < 0) {
      addVertex(a, auv.u, auv.v);
      addVertex(c, cuv.u, cuv.v);
      addVertex(b, buv.u, buv.v);
    } else {
      addVertex(a, auv.u, auv.v);
      addVertex(b, buv.u, buv.v);
      addVertex(c, cuv.u, cuv.v);
    }
  }

  for (const face of topology.faces) {
    for (let y = 0; y < segments; y++) {
      const v0 = y / segments;
      const v1 = (y + 1) / segments;
      for (let x = 0; x < segments; x++) {
        const u0 = x / segments;
        const u1 = (x + 1) / segments;
        const p00 = genus2SurfacePoint(face.key, u0, v0);
        const p10 = genus2SurfacePoint(face.key, u1, v0);
        const p01 = genus2SurfacePoint(face.key, u0, v1);
        const p11 = genus2SurfacePoint(face.key, u1, v1);
        addTriangle(p00, p10, p01, { u: u0, v: v0 }, { u: u1, v: v0 }, { u: u0, v: v1 });
        addTriangle(p10, p11, p01, { u: u1, v: v0 }, { u: u1, v: v1 }, { u: u0, v: v1 });
      }
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  let groupStart = 0;
  const verticesPerFace = GENUS2_PATCH_RENDER_SEGMENTS * GENUS2_PATCH_RENDER_SEGMENTS * 6;
  for (let i = 0; i < topology.faces.length; i++) {
    geo.addGroup(groupStart, verticesPerFace, i);
    groupStart += verticesPerFace;
  }
  const normals = [];
  for (let i = 0; i < positions.length; i += 3) {
    const normal = estimateGenus2Normal(positions[i], positions[i + 1], positions[i + 2]);
    normals.push(normal.x, normal.y, normal.z);
  }
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geo.computeBoundingSphere();
  return geo;
}

function createParametricGridGeometry(uSegments, vSegments, pointFn) {
  const positions = [];
  const uvs = [];
  const indices = [];
  const row = vSegments + 1;

  for (let i = 0; i <= uSegments; i++) {
    const u = i / uSegments;
    for (let j = 0; j <= vSegments; j++) {
      const v = j / vSegments;
      const p = pointFn(u, v);
      positions.push(p.x, p.y, p.z);
      uvs.push(u, v);
    }
  }

  for (let i = 0; i < uSegments; i++) {
    for (let j = 0; j < vSegments; j++) {
      const a = i * row + j;
      const b = (i + 1) * row + j;
      const c = i * row + j + 1;
      const d = (i + 1) * row + j + 1;
      indices.push(a, b, c, b, d, c);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  geo.computeBoundingSphere();
  return geo;
}

function mobiusPointUV(u01, v01) {
  const u = u01 * Math.PI * 2;
  const width = 0.48 * fieldScale;
  const R = 1.22 * fieldScale;
  const t = (v01 - 0.5) * 2 * width;
  const twist = u / 2;
  const radial = R + t * Math.cos(twist);
  return new THREE.Vector3(
    radial * Math.cos(u),
    t * Math.sin(twist),
    radial * Math.sin(u),
  );
}

function createMobiusGeometry() {
  return createParametricGridGeometry(128, 20, mobiusPointUV);
}

function projectiveSquareToDisk(a, b) {
  return {
    x: a * Math.sqrt(Math.max(0, 1 - (b * b) / 2)),
    y: b * Math.sqrt(Math.max(0, 1 - (a * a) / 2)),
  };
}

function projectivePointUV(u01, v01) {
  return boySurfacePoint(THREE, u01, v01, 1.1 * fieldScale);
}

function createProjectiveGeometry() {
  return createParametricGridGeometry(128, 128, projectivePointUV);
}

function kleinPointUV(u01, v01) {
  const u = u01 * Math.PI * 2;
  const v = v01 * Math.PI * 2;
  const tube = 2 * (1 - Math.cos(u) / 2);
  let x;
  let z;
  if (u < Math.PI) {
    x = 3 * Math.cos(u) * (1 + Math.sin(u)) + tube * Math.cos(u) * Math.cos(v);
    z = -8 * Math.sin(u) - tube * Math.sin(u) * Math.cos(v);
  } else {
    x = 3 * Math.cos(u) * (1 + Math.sin(u)) + tube * Math.cos(v + Math.PI);
    z = -8 * Math.sin(u);
  }
  const y = -tube * Math.sin(v);
  const s = 0.17 * fieldScale;
  return new THREE.Vector3(
    x * s,
    -z * s * 0.78,
    y * s,
  );
}

function createKleinGeometry() {
  return createParametricGridGeometry(128, 32, kleinPointUV);
}

const VIEW_MIN_DISTANCE = 2.5;
const VIEW_MAX_DISTANCE = 8;
let isSurfaceDragging = false;
let lastPointer = { x: 0, y: 0 };
const surfacePointers = new Map();
let pinchStartDistance = 0;
let pinchStartCameraDistance = 0;
renderer.domElement.style.touchAction = 'none';

  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);

function pointerDistance(points) {
  if (points.length < 2) return 0;
  return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
}

function clampViewDistance(distance) {
  return Math.max(VIEW_MIN_DISTANCE, Math.min(VIEW_MAX_DISTANCE, distance));
}

function setCameraDistance(distance) {
  camera.position.setLength(clampViewDistance(distance));
  camera.lookAt(0, 0, 0);
}

function beginSurfacePinch() {
  const points = [...surfacePointers.values()];
  pinchStartDistance = pointerDistance(points);
  pinchStartCameraDistance = camera.position.length();
}

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  surfacePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  isSurfaceDragging = true;
  lastPointer = { x: e.clientX, y: e.clientY };
  renderer.domElement.setPointerCapture(e.pointerId);
  if (surfacePointers.size >= 2) {
    isSurfaceDragging = false;
    beginSurfacePinch();
  }
}, { passive: false });

renderer.domElement.addEventListener('pointermove', e => {
  if (!surfacePointers.has(e.pointerId)) return;
  e.preventDefault();
  surfacePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (surfacePointers.size >= 2) {
    const distance = pointerDistance([...surfacePointers.values()]);
    if (pinchStartDistance > 0 && distance > 0) {
      setCameraDistance(pinchStartCameraDistance * (pinchStartDistance / distance));
    }
    return;
  }
  if (!isSurfaceDragging) return;
  const dx = e.clientX - lastPointer.x;
  const dy = e.clientY - lastPointer.y;
  lastPointer = { x: e.clientX, y: e.clientY };
  surfaceGroup.rotation.y += dx * 0.008;
  surfaceGroup.rotation.x += dy * 0.008;
}, { passive: false });

function stopSurfaceDrag(e) {
  if (e?.pointerId !== undefined) {
    surfacePointers.delete(e.pointerId);
  }
  if (e?.pointerId !== undefined && renderer.domElement.hasPointerCapture(e.pointerId)) {
    renderer.domElement.releasePointerCapture(e.pointerId);
  }
  if (surfacePointers.size === 0) {
    isSurfaceDragging = false;
    pinchStartDistance = 0;
    pinchStartCameraDistance = 0;
    return;
  }
  if (surfacePointers.size === 1) {
    const remaining = [...surfacePointers.values()][0];
    lastPointer = { ...remaining };
    isSurfaceDragging = true;
    pinchStartDistance = 0;
    pinchStartCameraDistance = 0;
    return;
  }
  beginSurfacePinch();
}

renderer.domElement.addEventListener('pointerup', stopSurfaceDrag);
renderer.domElement.addEventListener('pointercancel', stopSurfaceDrag);
renderer.domElement.addEventListener('lostpointercapture', stopSurfaceDrag);
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  const distance = camera.position.length();
  setCameraDistance(distance * Math.exp(e.deltaY * 0.001));
}, { passive: false });

function drawSurfaceGrid(ctx, size) {

  ctx.save();
  ctx.fillStyle = 'rgba(255, 253, 239, 0.07)';
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < columns; x++) {
      if ((x + y) % 2 === 0) ctx.fillRect(x * width, y * height, width, height);
    }
  }
  ctx.strokeStyle = 'rgba(39, 58, 52, 0.2)';
  ctx.lineWidth = Math.max(0.8, width * 0.055);
  ctx.beginPath();
  for (let x = 0; x <= columns; x++) {
    ctx.moveTo(x * width, 0); ctx.lineTo(x * width, size);
  }
  ctx.stroke();
  ctx.lineWidth = Math.max(0.8, height * 0.055);
  ctx.beginPath();
  for (let y = 0; y <= rows; y++) {
    ctx.moveTo(0, y * height); ctx.lineTo(size, y * height);

  ctx.stroke(); ctx.restore();
}

/* ===========================
   COORDINATE SYSTEM
   =========================== */
// Shared parametrizations for continuous motion and 3D rendering.
// Topological cuts use a reference cell decomposition, without snapping motion.
function surfacePoint(p) {
  if (MAP_TYPE === 'sphere') return cubeSpherePoint(p.face || 'F', p.u, p.v);
  if (MAP_TYPE === 'genus2') return genus2SurfacePoint(p.face || genus2StartFaceKey(), p.u, p.v);
  if (MAP_TYPE === 'projective') return projectivePointUV(p.u, p.v);
  if (MAP_TYPE === 'mobius') return mobiusPointUV(p.u, p.v);
  if (MAP_TYPE === 'klein') return kleinPointUV(p.u, p.v);
  const theta = p.u * Math.PI * 2, phi = p.v * Math.PI * 2;
  const radial = getR() + getr() * Math.cos(phi);
  return new THREE.Vector3(radial * Math.cos(theta), radial * Math.sin(theta), getr() * Math.sin(phi));
}

function continuousPatchTransition(p, edge) {
  const horizontal = edge === 'L' || edge === 'R';
  let start, end, targetFace, inward;
  if (MAP_TYPE === 'sphere') {
    const span = CUT_GRID_SIZE - 1;
    const transition = CUBE_TRANSITIONS[p.face || 'F'][edge];
    const at = t => transition(
      horizontal ? (edge === 'L' ? 0 : span) : t * span,
      horizontal ? t * span : (edge === 'U' ? 0 : span),
    );
    const a = at(0), b = at(1);
    start = { u: a.gx / span, v: a.gy / span };
    end = { u: b.gx / span, v: b.gy / span };
    targetFace = a.face; inward = { u: a.dir.dx, v: a.dir.dy };
  } else {
    const topology = getGenus2Topology();
    const face = topology.faceMap.get(p.face);
    const transition = face.transitions[edge];
    const target = topology.faceMap.get(transition.face);
    start = genus2LocalUVFromVoxel(target, genus2EdgePoint(face, edge, 0));
    end = genus2LocalUVFromVoxel(target, genus2EdgePoint(face, edge, 1));
    targetFace = transition.face;
    const direction = genus2InwardDirection(transition.edge);
    inward = { u: direction.dx, v: direction.dy };
  }
  const sign = edge === 'L' || edge === 'U' ? -1 : 1;
  const distance = edge === 'L' ? -p.u : edge === 'R' ? p.u - 1 : edge === 'U' ? -p.v : p.v - 1;
  const t = horizontal ? p.v : p.u;
  const tangent = horizontal ? p.dv : p.du;
  const outward = sign * (horizontal ? p.du : p.dv);
  return { ...p, face: targetFace,
    u: start.u + (end.u - start.u) * t + inward.u * distance,
    v: start.v + (end.v - start.v) * t + inward.v * distance,
    du: (end.u - start.u) * tangent + inward.u * outward,
    dv: (end.v - start.v) * tangent + inward.v * outward,
  };
}

const navigation = createSurfaceNavigator({
  THREE, mapType: MAP_TYPE, resolution: MAP_TYPE === 'genus2' ? GENUS2_PATCH_CELLS : CUT_GRID_SIZE,
  pointAt: surfacePoint, patchTransition: continuousPatchTransition,
  normalAt: (p, position, du, dv) => {
    if (MAP_TYPE === 'sphere') return position.clone().normalize();
    if (MAP_TYPE === 'genus2') return estimateGenus2Normal(position.x, position.y, position.z);
    return new THREE.Vector3().crossVectors(du, dv)
      .multiplyScalar((p.side ?? 1) * (MAP_TYPE === 'projective' ? -1 : 1));
  },
  advanceTopology: advanceTopologyState, cloneTopology: cloneTopologyState, emptyTopology: emptyTopologyState,
});

function atlasSpherePoint(p) {
  if (MAP_TYPE === 'sphere') return cubeSpherePoint(p.face || 'F', p.u, p.v).normalize();
  const disk = projectiveSquareToDisk(2 * p.u - 1, 2 * p.v - 1);
  const r = Math.min(1, Math.hypot(disk.x, disk.y)), angle = r * Math.PI / 2;
  const scale = r > 1e-10 ? Math.sin(angle) / r : Math.PI / 2;
  return new THREE.Vector3(disk.x * scale, disk.y * scale, Math.cos(angle));
}

function atlasPointFromSphere(s) {
  if (MAP_TYPE === 'sphere') {
    let face = 'F';
    for (const key of CUBE_FACE_KEYS) if (s.dot(CUBE_FACES[key].n) > s.dot(CUBE_FACES[face].n)) face = key;
    const basis = CUBE_FACES[face], denominator = s.dot(basis.n);
    return { face, u: (s.dot(basis.r) / denominator + 1) / 2, v: (s.dot(basis.d) / denominator + 1) / 2 };
  }
  const n = s.clone();
  if (n.z < 0) n.negate();
  const sine = Math.hypot(n.x, n.y), radius = Math.atan2(sine, n.z) * 2 / Math.PI;
  const x = sine > 1e-10 ? n.x * radius / sine : 0, y = sine > 1e-10 ? n.y * radius / sine : 0;
  const difference = x * x - y * y;
  const aa = 2 + difference, bb = 2 - difference;
  const a = Math.sign(x) * Math.sqrt(Math.max(0, (aa - Math.sqrt(Math.max(0, aa * aa - 8 * x * x))) / 2));
  const b = Math.sign(y) * Math.sqrt(Math.max(0, (bb - Math.sqrt(Math.max(0, bb * bb - 8 * y * y))) / 2));
  return { face: null, u: Math.max(0, Math.min(1, (a + 1) / 2)), v: Math.max(0, Math.min(1, (b + 1) / 2)) };
}

const atlas = createSurfaceAtlas({ THREE, navigation, mapType: MAP_TYPE,
  sphereAt: atlasSpherePoint, sphereToPoint: atlasPointFromSphere, sphereScale: MAP_TYPE === 'projective' ? 1.35 : BASE_R,
  implicitSurface: MAP_TYPE === 'genus2' ? {

  } : null });
navigation.setChartFactory(reference => atlas.createChart(reference));

function randomSurfacePoint(random) {
  const face = MAP_TYPE === 'sphere' ? CUBE_FACE_KEYS[Math.floor(random() * CUBE_FACE_KEYS.length)]
    : MAP_TYPE === 'genus2' ? getGenus2Topology().faces[Math.floor(random() * getGenus2Topology().faces.length)].key : null;
  const side = (MAP_TYPE === 'mobius' || MAP_TYPE === 'klein') && random() < 0.5 ? -1 : 1;
  return navigation.seed(0.015 + random() * 0.97, 0.015 + random() * 0.97, face, side);
}

function handleContinuousEvent(event) {
  if (event.type === 'crossing') {
    if (topologyStateFormula(event.from.topo) !== topologyStateFormula(event.topo)) {
      pi1LastStep = describeTopologyMove(event.from, event.move);
    }
    return;
  }
  if (event.type === 'grow') {
    if (event.score > best) {
      best = event.score;
      localStorage.setItem('snake3dBest_' + MAP_TYPE, best);
    }
    addMsg(tr('grew'), 'good');
  } else if (event.type === 'shrink') addMsg(tr('shortened'), 'warn');
  else if (event.type === 'slow') addMsg(tr('slowed'), 'good');
  else if (event.type === 'speedUp') addMsg(tr('spedUp'), 'warn');
  else if (event.type === 'cut') addMsg(event.info.failLabel || tr('failTrivial'), 'warn');
  else if (event.type === 'win') {
    clearMsgTimer();
    setMsg(event.info.winText || tr('winNontrivial', { label: event.info.label }), 'good');
  }
}

const continuousGame = createContinuousSnake({

const clayActors = createClayActors({

function disposeMaterial(material) {
  if (Array.isArray(material)) {
    material.forEach(disposeMaterial);
    return;
  }
  if (!material) return;
  if (material.map) material.map.dispose();
  material.dispose();
}

function disposeObject3D(object) {
  object.traverse(child => {
    if (child.geometry) child.geometry.dispose();
    if (child.material) disposeMaterial(child.material);
  });
}

function makeCutTube(points, color, radius, closed = false) {
  const curve = new THREE.CatmullRomCurve3(points, closed);
  const geometry = new THREE.TubeGeometry(curve, Math.max(8, points.length * 2), radius * fieldScale, 10, closed);
  const material = new THREE.MeshBasicMaterial({
    color: new THREE.Color(color),
    transparent: true,
    opacity: 0.98,
    depthWrite: false,
    depthTest: false,
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.renderOrder = 4;
  return mesh;
}

function makeCutPolylineTube(points, color, radius, depthTest = false) {
  if (points.length < 2) return new THREE.Group();
  const path = new THREE.CurvePath();
  for (let i = 1; i < points.length; i++) {
    path.add(new THREE.LineCurve3(points[i - 1], points[i]));
  }
  const geometry = new THREE.TubeGeometry(path, Math.max(8, points.length * 2), radius * fieldScale, 10, false);
  const material = new THREE.MeshBasicMaterial({
    color: new THREE.Color(color),
    transparent: true,
    opacity: 0.98,
    depthWrite: false,
    depthTest,
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.renderOrder = 4;
  return mesh;
}

function makeCutLabelSprite(label, color, scale) {
  const canvas = document.createElement('canvas');
  const size = 96;
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, size, size);
  ctx.fillStyle = color;
  ctx.strokeStyle = 'rgba(6,16,24,0.92)';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.arc(size / 2, size / 2, size * 0.34, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#061018';
  ctx.font = 'bold 42px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, size / 2, size / 2 + 2);

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const material = new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    depthWrite: false,
    depthTest: false,
  });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(scale * fieldScale, scale * fieldScale, scale * fieldScale);
  sprite.renderOrder = 5;
  return sprite;
}

function sampleParametricLoop(pointFn, count, uvAt) {
  const points = [];
  for (let i = 0; i < count; i++) {
    const uv = uvAt(i / count);
    points.push(pointFn(uv.u, uv.v));
  }
  return points;
}

function sampleParametricPath(pointFn, segments, uvAt) {
  const points = [];
  for (let i = 0; i <= segments; i++) {
    const uv = uvAt(i / segments);
    points.push(pointFn(uv.u, uv.v));
  }
  return points;
}

function projectiveBoundaryOverlayPoints() {
  return sampleParametricLoop(projectivePointUV, 96, t => {
    const q = t * 4;
    if (q < 1) return { u: q, v: 0 };
    if (q < 2) return { u: 1, v: q - 1 };
    if (q < 3) return { u: 3 - q, v: 1 };
    return { u: 0, v: 4 - q };
  });
}

function kleinCutOverlayPaths() {
  const uA = KLEIN_CUT_A_X / CUT_GRID_SIZE;
  const vB = KLEIN_CUT_B_Y / CUT_GRID_SIZE;
  return [
    {
      label: 'a',
      color: CUT_COLORS.a,
      points: sampleParametricPath(kleinPointUV, 128, t => ({ u: uA, v: t })),
    },
    {
      label: 'b',
      color: CUT_COLORS.b,
      points: sampleParametricPath(kleinPointUV, 160, t => ({ u: t, v: vB })),
    },
  ];
}

function createCutOverlayGroup() {
  if (!LOOP_WIN_MAPS.has(MAP_TYPE)) return null;
  const group = new THREE.Group();
  group.name = 'cut-overlay';

  if (MAP_TYPE === 'torus') {
    return null;
  } else if (MAP_TYPE === 'genus2') {
    for (const loop of getGenus2CutSchema().loops) {
      group.add(makeCutTube(loop.points, loop.color, 0.014, false));
      const sprite = makeCutLabelSprite(loop.label, loop.color, 0.13);
      const labelPoint = loop.points[Math.floor(loop.points.length / 2)] || loop.points[0];
      sprite.position.copy(labelPoint);
      group.add(sprite);
    }
  } else if (MAP_TYPE === 'projective') {
    const points = projectiveBoundaryOverlayPoints();
    group.add(makeCutTube(points, CUT_COLORS.a, 0.012, true));
    const sprite = makeCutLabelSprite('a', CUT_COLORS.a, 0.13);
    sprite.position.copy(points[Math.floor(points.length * 0.12)] || points[0]);
    group.add(sprite);
  } else if (MAP_TYPE === 'klein') {
    for (const path of kleinCutOverlayPaths()) {
      group.add(makeCutPolylineTube(path.points, path.color, 0.012, false));
      const sprite = makeCutLabelSprite(path.label, path.color, 0.13);
      const labelPoint = path.points[Math.floor(path.points.length / 3)] || path.points[0];
      sprite.position.copy(labelPoint);
      group.add(sprite);
    }
  }

  return group.children.length > 0 ? group : null;
}

/* ===========================
   SNAKE
   =========================== */
let snake = [];
let direction;
let pi1LastStep = null;

function wrapGrid(v) {
  return ((v % CUT_GRID_SIZE) + CUT_GRID_SIZE) % CUT_GRID_SIZE;
}


function clampGenus2Cell(v) {
  return Math.max(0, Math.min(GENUS2_PATCH_CELLS - 1, v));
}


function genus2InwardDirection(edge) {
  if (edge === 'L') return { dx: 1, dy: 0 };
  if (edge === 'R') return { dx: -1, dy: 0 };
  if (edge === 'U') return { dx: 0, dy: 1 };
  return { dx: 0, dy: -1 };
}

function genus2EntryCell(edge, edgeCell) {
  if (edge === 'L') return { gx: 0, gy: edgeCell };
  if (edge === 'R') return { gx: GENUS2_PATCH_CELLS - 1, gy: edgeCell };
  if (edge === 'U') return { gx: edgeCell, gy: 0 };
  return { gx: edgeCell, gy: GENUS2_PATCH_CELLS - 1 };
}

function genus2EdgeSample(face, edge, edgeCell) {
  const t = (edgeCell + 0.5) / GENUS2_PATCH_CELLS;
  return genus2EdgePoint(face, edge, t);
}

function normalizeGenus2Position(gx, gy, dir, side, faceKey) {
  const topology = getGenus2Topology();
  let currentFaceKey = faceKey || topology.startFaceKey;
  let ndir = dir ? { ...dir } : null;
  let guard = 0;

  while ((gx < 0 || gx >= GENUS2_PATCH_CELLS || gy < 0 || gy >= GENUS2_PATCH_CELLS) && guard++ < 20) {
    let edge;
    let overshoot;
    let edgeCell;
    if (gx < 0) {
      edge = 'L';
      overshoot = -gx - 1;
      edgeCell = clampGenus2Cell(gy);
    } else if (gx >= GENUS2_PATCH_CELLS) {
      edge = 'R';
      overshoot = gx - GENUS2_PATCH_CELLS;
      edgeCell = clampGenus2Cell(gy);
    } else if (gy < 0) {
      edge = 'U';
      overshoot = -gy - 1;
      edgeCell = clampGenus2Cell(gx);
    } else {
      edge = 'D';
      overshoot = gy - GENUS2_PATCH_CELLS;
      edgeCell = clampGenus2Cell(gx);
    }

    const currentFace = topology.faceMap.get(currentFaceKey);
    const transition = currentFace?.transitions[edge];
    if (!transition) return { gx, gy, dir: ndir, side, face: currentFaceKey, blocked: true };

    const sample = genus2EdgeSample(currentFace, edge, edgeCell);
    const nextFace = topology.faceMap.get(transition.face);
    const uv = genus2LocalUVFromVoxel(nextFace, sample);
    const nextEdgeCell = transition.edge === 'L' || transition.edge === 'R'
      ? clampGenus2Cell(Math.floor(uv.v * GENUS2_PATCH_CELLS))
      : clampGenus2Cell(Math.floor(uv.u * GENUS2_PATCH_CELLS));
    const entry = genus2EntryCell(transition.edge, nextEdgeCell);
    ndir = genus2InwardDirection(transition.edge);
    gx = entry.gx + ndir.dx * overshoot;
    gy = entry.gy + ndir.dy * overshoot;
    currentFaceKey = transition.face;
  }

  return {
    gx: clampGenus2Cell(gx),
    gy: clampGenus2Cell(gy),
    dir: ndir,
    side,
    face: currentFaceKey,
    mirror: 1,
  };
}


function inverseLetter(letter) {
  return letter === letter.toLowerCase() ? letter.toUpperCase() : letter.toLowerCase();
}

function invertWord(word) {
  return word.slice().reverse().map(inverseLetter);
}

function freeReduceWord(word) {
  const reduced = [];
  for (const letter of word) {
    if (reduced.length > 0 && inverseLetter(letter) === reduced[reduced.length - 1]) {
      reduced.pop();
    } else {
      reduced.push(letter);
    }
  }
  return reduced;
}

function symmetrizedRelators(relator) {
  const variants = [];
  const sources = [relator, invertWord(relator)];
  for (const source of sources) {
    for (let i = 0; i < source.length; i++) {
      variants.push(source.slice(i).concat(source.slice(0, i)));
    }
  }
  return variants;
}

function wordMatchesAt(word, start, pattern) {
  if (start + pattern.length > word.length) return false;
  for (let i = 0; i < pattern.length; i++) {
    if (word[start + i] !== pattern[i]) return false;
  }
  return true;
}

function dehnRulesFromRelator(relator) {
  const rules = [];
  const halfLength = relator.length / 2;
  for (const variant of symmetrizedRelators(relator)) {
    for (let len = relator.length; len > halfLength; len--) {
      rules.push({
        pattern: variant.slice(0, len),
        replacement: invertWord(variant.slice(len)),
      });
    }
  }
  return rules.sort((left, right) => right.pattern.length - left.pattern.length);
}

const GENUS2_DEHN_RULES = dehnRulesFromRelator(GENUS2_RELATOR);

function reduceGenus2Word(word) {
  let current = freeReduceWord(word);

  while (current.length > 0) {
    let match = null;
    for (let start = 0; start < current.length && !match; start++) {
      for (const rule of GENUS2_DEHN_RULES) {
        if (!wordMatchesAt(current, start, rule.pattern)) continue;
        match = { start, rule };
        break;
      }
    }

    if (!match) return current;

    current = freeReduceWord([
      ...current.slice(0, match.start),
      ...match.rule.replacement,
      ...current.slice(match.start + match.rule.pattern.length),
    ]);
  }

  return current;
}

function reduceProjectiveWord(word) {
  const count = word.filter(letter => letter.toLowerCase() === 'a').length;
  return count % 2 === 1 ? ['a'] : [];
}

function repeatSignedLetter(label, exponent) {
  const n = Math.abs(exponent);
  const letter = exponent >= 0 ? label : label.toUpperCase();
  return Array.from({ length: n }, () => letter);
}

function kleinNormalFormFromWord(word) {
  let a = 0;
  let b = 0;
  for (const letter of word) {
    if (letter === 'a') {
      a += 1;
      b = -b;
    } else if (letter === 'A') {
      a -= 1;
      b = -b;
    } else if (letter === 'b') {
      b += 1;
    } else if (letter === 'B') {
      b -= 1;
    }
  }
  return { a, b };
}

function kleinWordFromNormal(normal) {
  return [
    ...repeatSignedLetter('a', normal.a),
    ...repeatSignedLetter('b', normal.b),
  ];
}

function reduceKleinWord(word) {
  return kleinWordFromNormal(kleinNormalFormFromWord(word));
}

function reduceTopologyWord(word) {
  if (MAP_TYPE === 'genus2') return reduceGenus2Word(word);
  if (MAP_TYPE === 'projective') return reduceProjectiveWord(word);
  if (MAP_TYPE === 'klein') return reduceKleinWord(word);
  return freeReduceWord(word);
}

function invertTopologyWord(word) {
  if (MAP_TYPE === 'projective') {
    return word.slice().reverse().map(() => 'a');
  }
  return invertWord(word);
}

function kleinIdentityFrame() {
  return { ySign: 1 };
}

function cloneKleinFrame(frame) {
  return { ySign: frame?.ySign ?? 1 };
}

function emptyTopologyState() {
  if (MAP_TYPE === 'torus') return { wx: 0, wy: 0 };
  if (MAP_TYPE === 'mobius') return { w: 0, boundary: 0 };
  if (MAP_TYPE === 'genus2' || MAP_TYPE === 'projective') return { word: [] };
  if (MAP_TYPE === 'klein') return { word: [], frame: kleinIdentityFrame() };
  return null;
}

function cloneTopologyState(state) {
  if (!state) return emptyTopologyState();
  if (MAP_TYPE === 'torus') return { wx: state.wx || 0, wy: state.wy || 0 };
  if (MAP_TYPE === 'mobius') return { w: state.w || 0, boundary: state.boundary || 0 };
  if (MAP_TYPE === 'genus2' || MAP_TYPE === 'projective') return { word: [...(state.word || [])] };
  if (MAP_TYPE === 'klein') return { word: [...(state.word || [])], frame: cloneKleinFrame(state.frame) };
  return null;
}

function torusStepDelta(from, moveDir) {
  let wx = 0;
  let wy = 0;
  if (moveDir.dx === 1 && (from.gx + 1) % CUT_GRID_SIZE === TORUS_CUT_X) wx = 1;
  if (moveDir.dx === -1 && from.gx === TORUS_CUT_X) wx = -1;
  if (moveDir.dy === 1 && (from.gy + 1) % CUT_GRID_SIZE === TORUS_CUT_Y) wy = 1;
  if (moveDir.dy === -1 && from.gy === TORUS_CUT_Y) wy = -1;
  return { wx, wy };
}

function moveDirToEdge(moveDir) {
  if (moveDir.dx === 1) return 'R';
  if (moveDir.dx === -1) return 'L';
  if (moveDir.dy === 1) return 'D';
  return 'U';
}

function genus2MoveEdgeKey(from, moveDir) {
  return genus2GridEdgeKey(
    from.face || genus2StartFaceKey(),
    from.gx,
    from.gy,
    moveDirToEdge(moveDir),
  );
}

function genus2CellVoxelPoint(faceKey, gx, gy) {
  const topology = getGenus2Topology();
  const face = topology.faceMap.get(faceKey || topology.startFaceKey);
  return genus2VoxelPoint(
    face,
    (gx + 0.5) / GENUS2_PATCH_CELLS,
    (gy + 0.5) / GENUS2_PATCH_CELLS,
  );
}

function genus2MoveInCutCoordinates(from, moveDir, cutFaceKey) {
  const topology = getGenus2Topology();
  const fromFace = from.face || topology.startFaceKey;
  const cutFace = topology.faceMap.get(cutFaceKey || fromFace);
  if (!cutFace) return { dx: moveDir.dx, dy: moveDir.dy };
  const next = normalizeGenus2Position(
    from.gx + moveDir.dx,
    from.gy + moveDir.dy,
    moveDir,
    from.side ?? 1,
    fromFace,
  );
  if (next.blocked) return null;
  const fromUv = genus2LocalUVFromVoxel(cutFace, genus2CellVoxelPoint(fromFace, from.gx, from.gy));
  const toUv = genus2LocalUVFromVoxel(cutFace, genus2CellVoxelPoint(next.face, next.gx, next.gy));
  return {
    dx: (toUv.u - fromUv.u) * GENUS2_PATCH_CELLS,
    dy: (toUv.v - fromUv.v) * GENUS2_PATCH_CELLS,
  };
}

function genus2StepCrossingCandidates(from, moveDir) {
  const edgeKey = genus2MoveEdgeKey(from, moveDir);
  const cuts = getGenus2CutSchema().byEdgeKey.get(edgeKey);
  const face = from.face || genus2StartFaceKey();
  return (cuts || []).map(cut => {
    const cutMove = genus2MoveInCutCoordinates(from, moveDir, cut.face);
    if (!cutMove) return null;
    const det = cut.tx * cutMove.dy - cut.ty * cutMove.dx;
    return {
      cut,
      det,
      letter: det > 0 ? cut.label : cut.label.toUpperCase(),
      sameFace: cut.face === face,
    };
  }).filter(candidate => candidate && Math.abs(candidate.det) > 1e-6);
}

function genus2CutsHaveSameTangent(a, b) {
  return a.cut.tx === b.cut.tx && a.cut.ty === b.cut.ty;
}

function genus2OrderOverlappingCrossings(crossings) {
  const labels = crossings.map(crossing => crossing.cut.label).sort().join('');
  const orderByMiddleCut = (outerLabel, middleLabel) => {
    const middle = crossings.find(crossing => crossing.cut.label === middleLabel);
    const outers = crossings.filter(crossing => crossing.cut.label === outerLabel);
    if (!middle || outers.length !== 2) return crossings;
    const before = outers.find(crossing => genus2CutsHaveSameTangent(crossing, middle)) || outers[0];
    const after = outers.find(crossing => crossing !== before) || outers[1];
    return [before, middle, after];
  };
  if (labels === 'aac') return orderByMiddleCut('a', 'c');
  if (labels === 'bbd') return orderByMiddleCut('b', 'd');
  return crossings;
}

function genus2SelectedStepCrossing(from, moveDir) {
  const candidates = genus2StepCrossingCandidates(from, moveDir);
  if (candidates.length === 0) return null;
  return genus2ActiveStepCrossings(from, moveDir)[0] || null;
}

function genus2ActiveStepCrossings(from, moveDir) {
  const candidates = genus2StepCrossingCandidates(from, moveDir);
  if (candidates.length === 0) return [];
  const sameFace = candidates.filter(candidate => candidate.sameFace);
  const active = sameFace.length > 0 ? sameFace : [candidates[0]];
  const ordered = genus2OrderOverlappingCrossings(active);
  return ordered.length > 1 && ordered[0].det < 0 ? ordered.slice().reverse() : ordered;
}

function genus2StepWord(from, moveDir) {
  return genus2ActiveStepCrossings(from, moveDir).map(crossing => crossing.letter);
}

function boundaryCrossingEdge(from, moveDir) {
  if (moveDir.dx === 1 && from.gx === CUT_GRID_SIZE - 1) return 'R';
  if (moveDir.dx === -1 && from.gx === 0) return 'L';
  if (moveDir.dy === 1 && from.gy === CUT_GRID_SIZE - 1) return 'D';
  if (moveDir.dy === -1 && from.gy === 0) return 'U';
  return null;
}

function projectiveStepWord(from, moveDir) {
  return boundaryCrossingEdge(from, moveDir) ? ['a'] : [];
}

function mobiusStepDelta(from, moveDir) {
  let w = 0;
  let boundary = 0;
  if (moveDir.dx === 1 && from.gx === CUT_GRID_SIZE - 1) w = 1;
  if (moveDir.dx === -1 && from.gx === 0) w = -1;
  if (moveDir.dy === 1 && from.gy === CUT_GRID_SIZE - 1) boundary = 1;
  if (moveDir.dy === -1 && from.gy === 0) boundary = 1;
  return { w, boundary };
}

const KLEIN_CUTS = {
  // Fixed cut directions in the square chart.  The sign of b-crossings is read
  // after converting the move to the current topology frame.
  a: { label: 'a', tx: 0, ty: -1, cut: `u=${KLEIN_CUT_A_X}/N` },
  b: { label: 'b', tx: 1, ty: 0, cut: `v=${KLEIN_CUT_B_Y}/N` },
};

function crossesPeriodicGridLine(pos, delta, line) {
  if (delta === 1) return wrapGrid(pos + 1) === line;
  if (delta === -1) return wrapGrid(pos) === line;
  return false;
}

function kleinTopoMove(state, moveDir) {
  const ySign = state?.frame?.ySign ?? 1;
  return {
    dx: moveDir.dx,
    dy: ySign * moveDir.dy,
  };
}

function kleinLetterFromCrossing(cut, topoMove) {
  const det = cut.tx * topoMove.dy - cut.ty * topoMove.dx;
  return {
    det,
    letter: det > 0 ? cut.label : cut.label.toUpperCase(),
  };
}

function kleinStepCrossing(from, moveDir, state = from?.topo) {
  const current = cloneTopologyState(state);
  const topoMove = kleinTopoMove(current, moveDir);

  if (moveDir.dx !== 0 && crossesPeriodicGridLine(from.gx, moveDir.dx, KLEIN_CUT_A_X)) {
    const cut = KLEIN_CUTS.a;
    return { ...cut, ...kleinLetterFromCrossing(cut, topoMove), topoMove };
  }

  if (moveDir.dy !== 0 && crossesPeriodicGridLine(from.gy, moveDir.dy, KLEIN_CUT_B_Y)) {
    const cut = KLEIN_CUTS.b;
    return { ...cut, ...kleinLetterFromCrossing(cut, topoMove), topoMove };
  }

  return null;
}

function kleinStepWord(from, moveDir, state = from?.topo) {
  const crossing = kleinStepCrossing(from, moveDir, state);
  return crossing ? [crossing.letter] : [];
}

function advanceKleinTopologyState(state, from, moveDir) {
  const current = cloneTopologyState(state);
  const crossing = kleinStepCrossing(from, moveDir, current);
  // The cut is at u=1/2, while the parameter chart reverses v at u=0/1.
  // Both change the local-to-cut frame. Missing the chart seam makes a small
  // contractible rectangle there read bb instead of bB.
  const seam = boundaryCrossingEdge(from, moveDir);
  const flipsFrame = (crossing?.label === 'a') !== (seam === 'L' || seam === 'R');
  const nextYSign = flipsFrame
    ? -current.frame.ySign
    : current.frame.ySign;
  return {
    // Keep the raw cut-crossing word.  Reduction is only for testing/displaying
    // closed-loop classes; appending one step must not rewrite old crossings.
    word: [...current.word, ...(crossing ? [crossing.letter] : [])],
    frame: { ySign: nextYSign },
  };
}

function advanceTopologyState(state, from, moveDir) {
  if (!LOOP_WIN_MAPS.has(MAP_TYPE)) return null;
  const current = cloneTopologyState(state);
  if (MAP_TYPE === 'torus') {
    const delta = torusStepDelta(from, moveDir);
    return {
      wx: current.wx + delta.wx,
      wy: current.wy + delta.wy,
    };
  }
  if (MAP_TYPE === 'genus2') {
    return {
      word: reduceGenus2Word([...current.word, ...genus2StepWord(from, moveDir)]),
    };
  }
  if (MAP_TYPE === 'projective') {
    return {
      word: reduceProjectiveWord([...current.word, ...projectiveStepWord(from, moveDir)]),
    };
  }
  if (MAP_TYPE === 'mobius') {
    const delta = mobiusStepDelta(from, moveDir);
    return {
      w: current.w + delta.w,
      boundary: current.boundary + delta.boundary,
    };
  }
  if (MAP_TYPE === 'klein') {
    return advanceKleinTopologyState(current, from, moveDir);
  }
  return null;
}


function wordFormula(word) {
  return word && word.length > 0 ? word.join('') : '1';
}

function powerTerm(label, exponent) {
  if (exponent === 0) return '';
  const base = exponent > 0 ? label : label.toUpperCase();
  const n = Math.abs(exponent);
  return n === 1 ? base : `${base}^${n}`;
}

function torusStateFormula(state) {
  const wx = state?.wx || 0;
  const wy = state?.wy || 0;
  return [powerTerm('a', wx), powerTerm('b', wy)].filter(Boolean).join(' ') || '1';
}

function mobiusStateFormula(state) {
  const w = state?.w || 0;
  const boundary = state?.boundary || 0;
  const loop = powerTerm('a', w) || '1';
  return boundary > 0 ? `${loop}; ${tr('crossedBoundary', { n: boundary })}` : loop;
}

function kleinNormalFormula(word) {
  const normal = kleinNormalFormFromWord(word || []);
  return [powerTerm('a', normal.a), powerTerm('b', normal.b)].filter(Boolean).join(' ') || '1';
}

function topologyWordFormula(word) {
  if (MAP_TYPE === 'klein') return kleinNormalFormula(word);
  return wordFormula(word);
}

function topologyStateFormula(state) {
  if (MAP_TYPE === 'torus') return torusStateFormula(state);
  if (MAP_TYPE === 'mobius') return mobiusStateFormula(state);
  if (MAP_TYPE === 'klein') return wordFormula(state?.word || []);
  if (MAP_TYPE === 'genus2' || MAP_TYPE === 'projective') return topologyWordFormula(state?.word || []);
  return '1';
}

function topologyRelationFormula() {
  if (MAP_TYPE === 'torus') return 'abAB = 1';
  if (MAP_TYPE === 'genus2') return `${GENUS2_RELATOR.join('')} = 1`;
  if (MAP_TYPE === 'projective') return `${PROJECTIVE_RELATOR.join('')} = 1`;
  if (MAP_TYPE === 'mobius') return `π1 = <a> ≅ Z; ${tr('noBoundaryCross')}`;
  if (MAP_TYPE === 'klein') return `${KLEIN_RELATOR.join('')} = 1`;
  return '-';
}

function loopWordLabel(word) {
  return topologyWordFormula(word);
}

function setPi1Text(id, text, warn = false) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = 'pi1-val' + (warn ? ' pi1-warn' : '');
}

function describeTorusMove(from, moveDir) {
  const current = cloneTopologyState(from.topo);
  const delta = torusStepDelta(from, moveDir);
  const letters = [];
  if (delta.wx > 0) letters.push('a');
  if (delta.wx < 0) letters.push('A');
  if (delta.wy > 0) letters.push('b');
  if (delta.wy < 0) letters.push('B');
  if (letters.length === 0) {
    return {
      step: tr('noCut'),
      move: `(${moveDir.dx}, ${moveDir.dy})`,
      cut: '-',
      det: '-',
    };
  }
  const next = {
    wx: current.wx + delta.wx,
    wy: current.wy + delta.wy,
  };
  return {
    step: `cut ${letters.join('')} @ x=${TORUS_CUT_X}, y=${TORUS_CUT_Y}`,
    move: `(${moveDir.dx}, ${moveDir.dy})`,
    cut: letters.map(letter => letter.toLowerCase()).join(','),
    det: `${torusStateFormula(current)} · ${letters.join('')} = ${torusStateFormula(next)}`,
  };
}

function describeGenus2Move(from, moveDir) {
  const candidates = genus2StepCrossingCandidates(from, moveDir);
  const active = genus2ActiveStepCrossings(from, moveDir);
  const face = from.face || genus2StartFaceKey();
  if (active.length === 0) {
    return {
      step: tr('noCut'),
      move: `(${moveDir.dx}, ${moveDir.dy})`,
      cut: '-',
      det: '-',
    };
  }
  const letters = active.map(crossing => crossing.letter);
  const labels = [...new Set(active.map(crossing => crossing.cut.label))].join(',');
  const candidateText = candidates.length > active.length || active.length > 1
    ? tr('candidates', { list: candidates.map(c => c.letter).join(','), letter: letters.join('') })
    : `cut ${labels} -> ${letters.join('')}`;
  return {
    step: `${candidateText} @ ${face}`,
    move: `(${moveDir.dx}, ${moveDir.dy})`,
    cut: active.map(crossing => `${crossing.cut.label}:(${crossing.cut.tx}, ${crossing.cut.ty})`).join('; '),
    det: active.map(crossing => `${crossing.cut.tx}*${moveDir.dy} - ${crossing.cut.ty}*${moveDir.dx} = ${crossing.det}`).join('; '),
    warn: candidates.length > active.length || active.length > 1,
  };
}

function describeProjectiveMove(from, moveDir) {
  const edge = boundaryCrossingEdge(from, moveDir);
  if (!edge) {
    return {
      step: tr('noBoundaryCut'),
      move: `(${moveDir.dx}, ${moveDir.dy})`,
      cut: '-',
      det: '-',
    };
  }
  const before = wordFormula(from.topo?.word || []);
  const after = wordFormula(reduceProjectiveWord([...(from.topo?.word || []), 'a']));
  return {
    step: tr('boundaryToA', { edge }),
    move: `(${moveDir.dx}, ${moveDir.dy})`,
    cut: tr('boundaryEdge', { edge }),
    det: `${before}·a -> ${after}, aa=1`,
  };
}

function describeMobiusMove(from, moveDir) {
  const delta = mobiusStepDelta(from, moveDir);
  const before = mobiusStateFormula(from.topo);
  const afterState = {
    w: (from.topo?.w || 0) + delta.w,
    boundary: (from.topo?.boundary || 0) + delta.boundary,
  };
  if (delta.boundary > 0) {
    return {
      step: tr('crossedStripBoundary'),
      move: `(${moveDir.dx}, ${moveDir.dy})`,
      cut: tr('bandBoundary'),
      det: `${before} -> ${mobiusStateFormula(afterState)}; ${tr('noWinClosure')}`,
    };
  }
  if (delta.w === 0) {
    return {
      step: tr('noCut'),
      move: `(${moveDir.dx}, ${moveDir.dy})`,
      cut: '-',
      det: '-',
    };
  }
  const letter = delta.w > 0 ? 'a' : 'A';
  return {
    step: `cut a -> ${letter}`,
    move: `(${moveDir.dx}, ${moveDir.dy})`,
    cut: tr('glueEdgeU'),
    det: `${before}·${letter} = ${mobiusStateFormula(afterState)}`,
  };
}

function describeKleinMove(from, moveDir) {
  const current = cloneTopologyState(from.topo);
  const crossing = kleinStepCrossing(from, moveDir, current);
  const topoMove = kleinTopoMove(current, moveDir);
  if (!crossing) {
    return {
      step: tr('noCut'),
      move: `display (${moveDir.dx}, ${moveDir.dy}), topo (${topoMove.dx}, ${topoMove.dy})`,
      cut: '-',
      det: '-',
    };
  }
  const beforeRaw = wordFormula(current.word || []);
  const afterRawWord = [...(current.word || []), crossing.letter];
  const cutName = crossing.label === 'a' ? 'a: u=1/2' : 'b: v=1/4';
  return {
    step: `cut ${crossing.label} -> ${crossing.letter}`,
    move: `display (${moveDir.dx}, ${moveDir.dy}), topo (${crossing.topoMove.dx}, ${crossing.topoMove.dy})`,
    cut: `${cutName}; tangent=(${crossing.tx}, ${crossing.ty})`,
    det: `${crossing.tx}*${crossing.topoMove.dy} - ${crossing.ty}*${crossing.topoMove.dx} = ${crossing.det}; ${beforeRaw}·${crossing.letter} = ${wordFormula(afterRawWord)}; NF = ${kleinNormalFormula(afterRawWord)}`,
  };
}

function describeTopologyMove(from, moveDir) {
  if (MAP_TYPE === 'torus') return describeTorusMove(from, moveDir);
  if (MAP_TYPE === 'genus2') return describeGenus2Move(from, moveDir);
  if (MAP_TYPE === 'projective') return describeProjectiveMove(from, moveDir);
  if (MAP_TYPE === 'mobius') return describeMobiusMove(from, moveDir);
  if (MAP_TYPE === 'klein') return describeKleinMove(from, moveDir);
  return null;
}

function topologyDifferenceInfo(fromTopo, toTopo) {
  if (MAP_TYPE === 'sphere') {
    return {
      nontrivial: true,
      label: tr('closedLoopAny'),
      reducedLabel: tr('closedLoopAny'),
      winText: tr('winClosed'),
    };
  }

  if (MAP_TYPE === 'torus') {
    const wx = (toTopo?.wx || 0) - (fromTopo?.wx || 0);
    const wy = (toTopo?.wy || 0) - (fromTopo?.wy || 0);
    return {
      nontrivial: wx !== 0 || wy !== 0,
      label: torusStateFormula({ wx, wy }),
      reducedLabel: torusStateFormula({ wx, wy }),
    };
  }

  if (MAP_TYPE === 'mobius') {
    const w = (toTopo?.w || 0) - (fromTopo?.w || 0);
    const boundary = Math.abs((toTopo?.boundary || 0) - (fromTopo?.boundary || 0));
    const crossesBoundary = boundary > 0;
    return {
      nontrivial: w !== 0 && !crossesBoundary,
      label: mobiusStateFormula({ w, boundary }),
      reducedLabel: mobiusStateFormula({ w, boundary }),
      failLabel: crossesBoundary ? tr('failBoundary') : tr('failTrivial'),
    };
  }

  const rawWord = [
    ...invertTopologyWord(fromTopo?.word || []),
    ...(toTopo?.word || []),
  ];
  const word = reduceTopologyWord(rawWord);
  return {
    nontrivial: word.length > 0,
    label: loopWordLabel(word),
    rawWord,
    word,
    reducedLabel: topologyWordFormula(word),
  };
}

function updatePi1Panel() {
  const panel = document.getElementById('pi1-panel');
  panel.style.display = topologyHintsVisible && PI1_PANEL_MAPS.has(MAP_TYPE) ? 'block' : 'none';
  if (!topologyHintsVisible || !PI1_PANEL_MAPS.has(MAP_TYPE) || !snake.length) return;
  const head = snake[0], tail = snake[snake.length - 1];
  const last = pi1LastStep || { step: tr('notMoved'), cut: '-', det: '-' };
  setPi1Text('pi1Rel', topologyRelationFormula());
  setPi1Text('pi1Step', last.step, !!last.warn);
  setPi1Text('pi1Move', '(' + head.u.toFixed(3) + ', ' + head.v.toFixed(3) + ')');
  setPi1Text('pi1Cut', last.cut);
  setPi1Text('pi1Det', last.det);
  setPi1Text('pi1Head', topologyStateFormula(head.topo));
  setPi1Text('pi1Tail', topologyStateFormula(tail.topo));
  setPi1Text('pi1Body', 'T⁻¹ H = ' + topologyDifferenceInfo(tail.topo, head.topo).reducedLabel);
  const closure = continuousGame.state().lastClosure;
  setPi1Text('pi1Close', closure
    ? closure.reducedLabel + ' (' + tr(closure.nontrivial ? 'nontrivial' : 'trivial') + ')'
    : tr('nextNotClosed'), closure && !closure.nontrivial);
}


/* ===========================
   FOOD
   =========================== */
let foods = [];

/* ===========================
   GAME STATE
   =========================== */
let fieldScale = 1.0;
let score, speed, best, running, paused;
let msgTimer = null;
let topologyHintsVisible = false;

function victoryGoalText() {
  if (MAP_TYPE === 'sphere') return tr('goalSphere');
  if (MAP_TYPE === 'torus') return tr('goalTorus');
  if (MAP_TYPE === 'genus2') return tr('goalGenus2');
  if (MAP_TYPE === 'projective') return tr('goalProjective');
  if (MAP_TYPE === 'mobius') return tr('goalMobius');
  if (MAP_TYPE === 'klein') return tr('goalKlein');
  return tr('goalDefault');
}

function updateUI() {
  syncContinuousState();
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
  document.getElementById('goalText').textContent = victoryGoalText();
  document.getElementById('pauseOverlay').style.display = paused ? 'flex' : 'none';
  document.getElementById('pauseBtn').textContent = paused ? tr('resume') : tr('pause');
  document.getElementById('topologyHintsBtn').textContent = topologyHintsVisible ? tr('hideHints') : tr('showHints');
}


function togglePause() {
  if (!continuousGame.state().running) return;
  clearSteering();
  continuousGame.togglePause();
  updateUI();
}

function toggleTopologyHints() {
  topologyHintsVisible = !topologyHintsVisible;
  if (cutOverlayGroup) cutOverlayGroup.visible = topologyHintsVisible;
  updatePi1Panel();
  updateUI();
}

function setMsg(text, cls) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg-area' + (cls ? ' ' + cls : '');
}

function clearMsgTimer() {
  if (msgTimer) clearTimeout(msgTimer);
  msgTimer = null;
}

function addMsg(text, cls, duration = 1600) {
  clearMsgTimer();
  setMsg(text, cls);
  if (duration > 0) {
    msgTimer = setTimeout(() => {
      setMsg('');
      msgTimer = null;
    }, duration);
  }
}

/* ===========================
   GAME LOGIC
   =========================== */


/* ===========================
   CAMERA
   =========================== */
function resetCamera() {
  const position = (MAP_TYPE === 'genus2' ? GENUS2_CAMERA_POSITION : DEFAULT_CAMERA_POSITION).clone();
  if (MAP_TYPE === 'genus2' || MAP_TYPE === 'klein') position.multiplyScalar(0.85);
  if (MOBILE_VIEW_QUERY.matches) position.multiplyScalar(MOBILE_CAMERA_DISTANCE_SCALE);
  camera.position.copy(position);
  camera.lookAt(0, 0, 0);
  surfaceGroup.rotation.set(0, 0, 0);
}


/* ===========================
   INPUT
   =========================== */
const steeringKeys = new Set();
const steeringPointers = new Map();

function updateSteering() {
  const left = steeringKeys.has('arrowleft') || steeringKeys.has('a') || [...steeringPointers.values()].includes(-1);
  const right = steeringKeys.has('arrowright') || steeringKeys.has('d') || [...steeringPointers.values()].includes(1);
  continuousGame.setTurn(Number(right) - Number(left));
}
function clearSteering() {
  steeringKeys.clear(); steeringPointers.clear(); updateSteering();
}
document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if (['arrowleft', 'arrowright', 'a', 'd'].includes(key)) {
    e.preventDefault(); steeringKeys.add(key); updateSteering(); return;
  }
  if (e.repeat) return;
  if (key === ' ' || key === 'p') { e.preventDefault(); togglePause(); }
  if (key === 'r') resetCamera();
});
document.addEventListener('keyup', e => {
  if (steeringKeys.delete(e.key.toLowerCase())) { e.preventDefault(); updateSteering(); }
});
function pauseWhenInactive() {
  clearSteering();
  for (const pointerId of surfacePointers.keys()) {
    if (renderer.domElement.hasPointerCapture(pointerId)) renderer.domElement.releasePointerCapture(pointerId);
  }
  surfacePointers.clear(); isSurfaceDragging = false; pinchStartDistance = 0;
  if (continuousGame.state().running) continuousGame.setPaused(true);
  updateUI();
}
window.addEventListener('blur', pauseWhenInactive);
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseWhenInactive(); });
document.getElementById('restart').addEventListener('click', init);

document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('topologyHintsBtn').addEventListener('click', toggleTopologyHints);
document.getElementById('resetCam').addEventListener('click', resetCamera);

/* ===========================
   INIT
   =========================== */
function init() {
  applyStaticText();
  document.getElementById('surface-caption').textContent = LANG === 'zh' ? '流形' : 'Manifold';
  fieldScale = 1.0;
  ensureSurfaceGeometry();
  textureHintState = null;
  clearMsgTimer(); clearSteering(); pi1LastStep = null;
  chartView.reset();
  best = parseInt(localStorage.getItem('snake3dBest_' + MAP_TYPE) || '0');
  const start = MAP_TYPE === 'sphere' ? navigation.seed(0.52, 0.52, 'F')
    : MAP_TYPE === 'genus2' ? navigation.seed(0.5, 0.5, genus2StartFaceKey())
    : MAP_TYPE === 'torus' ? navigation.seed(0.12, 0.23)
    : MAP_TYPE === 'projective' ? navigation.seed(0.7, 0.6)
    : navigation.seed(0.12, 0.5);
  continuousGame.reset(start);
  setMsg(''); updateUI(); resetCamera();
}

/* ===========================
   LOCAL MAP (2D CHART)
   =========================== */
const mapCanvas = document.getElementById('mapCanvas');
const touchControlZone = document.getElementById('touch-control-zone');
function setPointerSteering(e) {
  const bounds = mapCanvas.getBoundingClientRect();
  steeringPointers.set(e.pointerId, e.clientX < bounds.left + bounds.width / 2 ? -1 : 1);
  updateSteering();
}
function bindChartControlSurface(el) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    el.setPointerCapture(e.pointerId); setPointerSteering(e);
  });
  el.addEventListener('pointermove', e => {
    if (!steeringPointers.has(e.pointerId)) return;
    e.preventDefault(); e.stopPropagation(); setPointerSteering(e);
  });
  const release = e => {
    steeringPointers.delete(e.pointerId); updateSteering();
    if (el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId);
  };
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('lostpointercapture', release);
}
bindChartControlSurface(mapCanvas);
bindChartControlSurface(document.getElementById('map-panel'));
bindChartControlSurface(touchControlZone);

const chartView = createChartView({ THREE, canvas: mapCanvas, parent: surfaceGroup, atlas, navigation,
  colors: Object.fromEntries(Object.entries(FOOD_DEF).map(([key, value]) => [key, '#' + value.color.toString(16).padStart(6, '0')])) });
function drawMiniMap() { chartView.update(continuousGame.state()); }

/* ===========================
   RENDER LOOP
   =========================== */
function render(now = performance.now()) {
  requestAnimationFrame(render);
  const elapsed = lastRenderTime === null ? 0 : (now - lastRenderTime) / 1000;
  lastRenderTime = now;
  continuousGame.update(elapsed);
  syncContinuousState();
  redrawTexture();
  clayActors.update(now);
  drawMiniMap();
  updatePi1Panel();
  updateUI();
  renderer.render(scene, camera);
}

let lastRenderTime = null;
init();
if (urlParams.get('debug') === '1') window.snakeDebug = { game: continuousGame, navigation, atlas, chartView, clayActors, surfacePoint, THREE };
render();
